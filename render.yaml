# Render Blueprint: Postgres + Django API (Docker) + React static site, all on free plans.
# Render -> New -> Blueprint -> pick this repo. Values marked `sync: false` are asked for once.
# See docs/deployment.md for the order of steps and the URLs to fill in.

databases:
  - name: spotter-db
    plan: free
    databaseName: spotter
    user: spotter

services:
  - type: web
    name: spotter-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spotter-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MAPBOX_ACCESS_TOKEN
        sync: false # your Mapbox token; stays server-side
      - key: CORS_ALLOWED_ORIGINS
        sync: false # the static site's URL, e.g. https://spotter-app.onrender.com
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    name: spotter-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # the API's URL, e.g. https://spotter-api.onrender.com (read at build time)
      - key: NODE_VERSION
        value: "24" # Vite 8 needs Node 20.19+ or 22.12+; also pinned in frontend/.node-version
    headers:
      # Vite fingerprints asset file names, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
